[workspace]
resolver = "2"
members = [
    "crates/nyx-core",
    "crates/nyx-ipc",
    "crates/nyx-config",
    "crates/nyx-wm",
    "crates/nyx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["tbenn"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
] }